<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>뉴욕꼬맹이 인쇄큐</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --bg:#0f0f0f; --surface:#1a1a1a; --card:#222; --border:#2e2e2e;
  --ink:#f0f0f0; --ink2:#aaa; --ink3:#555;
  --pc1:#e8a020; --pc1-bg:#1a1500; --pc1-lt:#2a2000;
  --pc2:#20a0e8; --pc2-bg:#001520; --pc2-lt:#001e2d;
  --green:#2ed573; --green-bg:rgba(46,213,115,.1);
  --red:#ff4757; --red-bg:rgba(255,71,87,.1);
  --orange:#ffa502; --orange-bg:rgba(255,165,2,.1);
  --mono:'IBM Plex Mono',monospace;
  --sans:'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}

/* HEADER */
.header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;gap:10px;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-ic{width:34px;height:34px;border-radius:8px;background:var(--pc1);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-title{font-size:14px;font-weight:900}
.logo-sub{font-size:10px;color:var(--ink3);font-family:var(--mono)}
.header-right{display:flex;gap:6px;align-items:center}
.btn-sm{height:34px;padding:0 12px;border-radius:8px;border:none;
  font-size:11px;font-weight:700;cursor:pointer;font-family:var(--sans);
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-load{background:var(--pc2);color:#fff}
.btn-load:hover{opacity:.85}
.btn-load:disabled{background:var(--border);color:var(--ink3);cursor:not-allowed}
.btn-cfg{background:var(--card);color:var(--ink2);border:1px solid var(--border)}
.btn-reset{background:var(--card);color:var(--red);border:1px solid var(--border)}

/* SUMMARY BAR */
.summary{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.sum-item{display:flex;align-items:center;gap:6px;font-size:12px}
.sum-dot{width:8px;height:8px;border-radius:50%}
.sum-val{font-family:var(--mono);font-weight:700}

/* MAIN */
.main{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 110px)}
.col{border-right:1px solid var(--border)}
.col:last-child{border-right:none}
.col-header{
  padding:11px 14px;border-bottom:2px solid;
  display:flex;align-items:center;gap:10px;
  position:sticky;top:60px;z-index:90;
}
.col.pc1 .col-header{border-color:var(--pc1);background:var(--pc1-bg)}
.col.pc2 .col-header{border-color:var(--pc2);background:var(--pc2-bg)}
.col-badge{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;flex-shrink:0}
.pc1 .col-badge{background:var(--pc1);color:#000}
.pc2 .col-badge{background:var(--pc2);color:#000}
.col-info{flex:1;min-width:0}
.col-title{font-size:12px;font-weight:900}
.col-sub{font-size:10px;color:var(--ink3);margin-top:1px}
.col-count{font-family:var(--mono);font-size:11px;color:var(--ink3);
  background:var(--border);padding:2px 7px;border-radius:4px;flex-shrink:0}

/* SECTION LABEL */
.sec-label{
  padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;display:flex;align-items:center;gap:6px;
}
.sec-label.can{background:var(--green-bg);color:var(--green);border-bottom:1px solid rgba(46,213,115,.15)}
.sec-label.short{background:var(--red-bg);color:var(--red);border-bottom:1px solid rgba(255,71,87,.15)}

/* ITEMS */
.items-wrap{padding:8px}
.print-item{
  border-radius:9px;margin-bottom:7px;overflow:hidden;
  border:1.5px solid;transition:all .15s;cursor:pointer;
}
.print-item:active{transform:scale(.98)}
.print-item.can:not(.done){background:var(--pc1-lt);border-color:rgba(232,160,32,.25)}
.col.pc2 .print-item.can:not(.done){background:var(--pc2-lt);border-color:rgba(32,160,232,.25)}
.print-item.short{background:rgba(255,71,87,.05);border-color:rgba(255,71,87,.2);cursor:default;opacity:.7}
.print-item.done{background:var(--card);border-color:var(--border);opacity:.45}

.item-main{display:flex;align-items:center;gap:8px;padding:10px 12px}
.item-check{width:24px;height:24px;border-radius:6px;border:2px solid;
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.pc1 .print-item.can:not(.done) .item-check{border-color:var(--pc1)}
.pc2 .print-item.can:not(.done) .item-check{border-color:var(--pc2)}
.print-item.short .item-check{border-color:var(--red);color:var(--red)}
.print-item.done .item-check{background:var(--green);border-color:var(--green);color:#000}

.item-code{font-family:var(--mono);font-size:12px;font-weight:700;flex-shrink:0;min-width:50px}
.pc1 .print-item.can:not(.done) .item-code{color:var(--pc1)}
.pc2 .print-item.can:not(.done) .item-code{color:var(--pc2)}
.print-item.short .item-code{color:var(--red)}
.print-item.done .item-code{color:var(--ink3)}

.item-info{flex:1;min-width:0}
.item-color{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-size{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:1px}
.print-item.done .item-color,.print-item.done .item-size{color:var(--ink3)}

.item-right{text-align:right;flex-shrink:0}
.item-qty{font-family:var(--mono);font-size:18px;font-weight:700}
.pc1 .print-item.can:not(.done) .item-qty{color:var(--pc1)}
.pc2 .print-item.can:not(.done) .item-qty{color:var(--pc2)}
.print-item.done .item-qty{color:var(--ink3)}
.item-unit{font-size:10px;color:var(--ink3);font-family:var(--mono)}

/* 부족 표시 */
.shortage-bar{
  padding:4px 12px 8px;display:flex;align-items:center;gap:6px;
  font-size:10px;color:var(--red);font-family:var(--mono);
}
.shortage-bar .fill{flex:1;height:3px;border-radius:2px;background:rgba(255,71,87,.2);overflow:hidden}
.shortage-bar .fill-inner{height:100%;background:var(--red);border-radius:2px}

/* EMPTY / LOADING */
.empty{padding:30px 16px;text-align:center;color:var(--ink3);font-size:12px;line-height:1.8}
.empty-ic{font-size:28px;margin-bottom:8px}
.loading{padding:30px;text-align:center;color:var(--ink3)}
.spinner{width:24px;height:24px;border:3px solid var(--border);
  border-top-color:var(--pc2);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* PROGRESS */
.prog-row{background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 16px;display:flex;gap:12px}
.prog-item{flex:1}
.prog-label{font-size:10px;color:var(--ink3);font-family:var(--mono);
  display:flex;justify-content:space-between;margin-bottom:3px}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .4s}
.prog-fill.p1{background:var(--pc1)}
.prog-fill.p2{background:var(--pc2)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);
  backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-end}
.modal-overlay.show{display:flex}
.modal-sheet{width:100%;max-width:600px;margin:0 auto;background:var(--surface);
  border-radius:16px 16px 0 0;border-top:1px solid var(--border);
  padding:16px 16px 32px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:14px;font-weight:900;margin-bottom:12px}
.url-row{display:flex;gap:8px;margin-bottom:12px}
.url-input{flex:1;background:var(--card);border:1.5px solid var(--border);
  border-radius:8px;padding:9px 11px;color:var(--ink);
  font-size:11px;font-family:var(--mono);outline:none}
.url-input:focus{border-color:var(--pc2)}
.btn-save{background:var(--border);color:var(--ink);border:none;border-radius:8px;
  padding:0 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.cfg-section{margin-top:12px}
.cfg-title{font-size:11px;font-weight:700;margin-bottom:6px}
.cfg-pc-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.cfg-code-btn{padding:3px 9px;border-radius:5px;font-family:var(--mono);
  font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .12s}
.cfg-code-btn.pc1{background:var(--pc1-lt);color:var(--pc1);border-color:var(--pc1)}
.cfg-code-btn.pc2{background:var(--pc2-lt);color:var(--pc2);border-color:var(--pc2)}
.modal-close{width:100%;height:42px;background:var(--card);color:var(--ink2);
  border:1px solid var(--border);border-radius:9px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:var(--sans);margin-top:14px}

/* TOAST */
.toast{position:fixed;bottom:16px;left:50%;
  transform:translateX(-50%) translateY(30px);opacity:0;
  background:var(--surface);color:var(--ink);padding:10px 18px;
  border-radius:20px;font-size:12px;font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,.5);border:1px solid var(--border);
  transition:all .25s;z-index:999;white-space:nowrap;font-family:var(--sans)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:500px){
  .main{grid-template-columns:1fr}
  .col{border-right:none;border-bottom:1px solid var(--border)}
  .col-header{top:58px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <div class="logo-ic">🖨️</div>
    <div>
      <div class="logo-title">뉴욕꼬맹이 인쇄큐</div>
      <div class="logo-sub" id="header-date"></div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-sm btn-cfg" onclick="openModal()">⚙️ 설정</button>
    <button class="btn-sm btn-reset" onclick="resetChecks()">↺</button>
    <button class="btn-sm btn-load" id="load-btn" onclick="loadData()">
      📊 구글시트 불러오기
    </button>
  </div>
</div>

<!-- PROGRESS -->
<div class="prog-row">
  <div class="prog-item">
    <div class="prog-label">
      <span style="color:var(--pc1)">DTP1 완료</span>
      <span id="prog1-txt">0/0</span>
    </div>
    <div class="prog-bar"><div class="prog-fill p1" id="prog1-bar" style="width:0%"></div></div>
  </div>
  <div class="prog-item">
    <div class="prog-label">
      <span style="color:var(--pc2)">DTP2 완료</span>
      <span id="prog2-txt">0/0</span>
    </div>
    <div class="prog-bar"><div class="prog-fill p2" id="prog2-bar" style="width:0%"></div></div>
  </div>
</div>

<!-- SUMMARY -->
<div class="summary" id="summary" style="display:none">
  <div class="sum-item">
    <div class="sum-dot" style="background:var(--green)"></div>
    <span>인쇄 가능</span>
    <span class="sum-val" id="sum-can" style="color:var(--green)">0</span>
    <span style="color:var(--ink3);font-size:11px">건</span>
  </div>
  <div class="sum-item">
    <div class="sum-dot" style="background:var(--red)"></div>
    <span>전사지 부족</span>
    <span class="sum-val" id="sum-short" style="color:var(--red)">0</span>
    <span style="color:var(--ink3);font-size:11px">건</span>
  </div>
  <div class="sum-item" style="margin-left:auto;font-size:11px;color:var(--ink3)">
    총 주문 <span class="sum-val" id="sum-total" style="color:var(--ink2)">0</span>건
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="col pc1">
    <div class="col-header">
      <div class="col-badge">PC1</div>
      <div class="col-info">
        <div class="col-title">DTP 1번 프린터</div>
        <div class="col-sub" id="pc1-sub">W, A, G, TJ 시리즈</div>
      </div>
      <div class="col-count" id="pc1-count">0건</div>
    </div>
    <div id="pc1-body">
      <div class="empty"><div class="empty-ic">📊</div><div>구글시트 불러오기를<br>클릭하세요</div></div>
    </div>
  </div>
  <div class="col pc2">
    <div class="col-header">
      <div class="col-badge">PC2</div>
      <div class="col-info">
        <div class="col-title">DTP 2번 프린터</div>
        <div class="col-sub" id="pc2-sub">IT, P, AS 시리즈</div>
      </div>
      <div class="col-count" id="pc2-count">0건</div>
    </div>
    <div id="pc2-body">
      <div class="empty"><div class="empty-ic">📊</div><div>구글시트 불러오기를<br>클릭하세요</div></div>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">⚙️ 구글시트 연결 설정</div>
    <div class="url-row">
      <input class="url-input" id="url-input"
        placeholder="https://script.google.com/macros/s/.../exec">
      <button class="btn-save" onclick="saveUrl()">저장</button>
    </div>
    <div class="cfg-section">
      <div class="cfg-title" style="color:var(--pc1)">🟡 PC1 → DTP1 담당 코드</div>
      <div class="cfg-pc-row" id="cfg-pc1"></div>
      <div class="cfg-title" style="color:var(--pc2)">🔵 PC2 → DTP2 담당 코드</div>
      <div class="cfg-pc-row" id="cfg-pc2"></div>
    </div>
    <button class="modal-close" onclick="closeModal()">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════ STATE ══════════════
let pcMap = JSON.parse(localStorage.getItem('pcMap')||'null') || {
  pc1: ['W','A','G','TJ','NKM'],
  pc2: ['IT','P','AS','WZ','ASS'],
};
let doneSet = new Set(JSON.parse(localStorage.getItem('doneSet')||'[]'));
let queueData = { pc1:[], pc2:[] }; // {id, code, color, size, orderQty, printQty, transferStock, canPrint}

// ══════════════ INIT ══════════════
(function init(){
  const now = new Date();
  document.getElementById('header-date').textContent =
    now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}) +
    ' ' + now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});

  const cfg = JSON.parse(localStorage.getItem('gs_config')||'{}');
  if (cfg.url) document.getElementById('url-input').value = cfg.url;

  renderCfg();
  updateSubLabels();
})();

// ══════════════ LOAD FROM SHEETS ══════════════
async function loadData() {
  const cfg = JSON.parse(localStorage.getItem('gs_config')||'{}');
  if (!cfg.url) { openModal(); showToast('⚙️ 먼저 URL을 설정하세요'); return; }

  const btn = document.getElementById('load-btn');
  btn.disabled = true; btn.textContent = '⏳ 불러오는 중...';

  document.getElementById('pc1-body').innerHTML =
    '<div class="loading"><div class="spinner"></div><div>구글시트 조회 중...</div></div>';
  document.getElementById('pc2-body').innerHTML =
    '<div class="loading"><div class="spinner"></div></div>';

  try {
    let json;
    const isVercel = location.protocol !== 'file:' &&
                     !location.hostname.includes('localhost') &&
                     !location.hostname.includes('127.0.0.1');

    if (isVercel) {
      const res = await fetch(`/api/inventory?url=${encodeURIComponent(cfg.url)}&action=getInventory`);
      json = await res.json();
    } else {
      const res = await fetch(cfg.url + '?action=getInventory', {redirect:'follow'});
      json = await res.json();
    }

    if (json.status !== 'ok') throw new Error(json.message || '응답 오류');

    calculate(json.data);
    render();
    showToast('✅ 불러오기 완료');

  } catch(e) {
    document.getElementById('pc1-body').innerHTML =
      `<div class="empty"><div class="empty-ic">❌</div><div>연결 실패<br>${e.message}<br><br>Apps Script 재배포 확인 후<br>다시 시도하세요</div></div>`;
    document.getElementById('pc2-body').innerHTML = '';
    showToast('❌ ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '📊 구글시트 불러오기';
  }
}

// ══════════════ CALCULATE ══════════════
function calculate(data) {
  const orders = (data.orders || []).filter(o =>
    o.code && !String(o.status||'').includes('차감완료')
  );
  const transferMap = {};
  (data.transfer || []).forEach(t => { transferMap[t.code] = parseInt(t.stock)||0; });

  // 코드별 총 주문 수량 계산
  const codeTotal = {};
  orders.forEach(o => {
    const c = o.code.toUpperCase();
    codeTotal[c] = (codeTotal[c]||0) + (parseInt(o.qty)||1);
  });

  // 코드별 인쇄 가능 수량 (전사지 재고 기준)
  const codePrintable = {};
  Object.keys(codeTotal).forEach(code => {
    const stock = transferMap[code] ?? transferMap[code.replace(/^IT/,'IT')] ?? -1;
    codePrintable[code] = stock < 0 ? 0 : Math.min(codeTotal[code], stock);
  });

  // 개별 주문 라인별 인쇄 가능 여부
  const orderMap = {};
  orders.forEach(o => {
    const code = o.code.toUpperCase();
    const key = `${code}||${o.color}||${o.size}`;
    if (!orderMap[key]) orderMap[key] = {
      code, color: o.color, size: o.size,
      orderQty: 0,
      transferStock: transferMap[code] ?? -1,
      id: code + '_' + o.color + '_' + o.size
    };
    orderMap[key].orderQty += parseInt(o.qty)||1;
  });

  // 각 라인별 인쇄 가능 수량 계산 (코드별 재고 비례 배분)
  // 같은 코드 여러 라인이 있으면 순서대로 재고 할당
  const codeRemaining = {};
  Object.keys(codeTotal).forEach(c => {
    codeRemaining[c] = transferMap[c] ?? -1;
  });

  const items = Object.values(orderMap);
  // 수량 많은 순으로 정렬
  items.sort((a,b) => b.orderQty - a.orderQty);

  items.forEach(item => {
    const rem = codeRemaining[item.code];
    if (rem < 0) {
      // 전사지 시트에 없음
      item.printQty = 0;
      item.canPrint = false;
      item.noStock = true;
    } else if (rem === 0) {
      item.printQty = 0;
      item.canPrint = false;
    } else {
      item.printQty = Math.min(item.orderQty, rem);
      item.canPrint = item.printQty >= item.orderQty;
      codeRemaining[item.code] = Math.max(0, rem - item.orderQty);
    }
  });

  // PC 분류
  queueData = { pc1:[], pc2:[] };
  items.forEach(item => {
    const pc = getPC(item.code);
    queueData[pc].push(item);
  });

  // 각 PC 내에서 인쇄가능 먼저, 부족 나중
  ['pc1','pc2'].forEach(pc => {
    queueData[pc].sort((a,b) => {
      if (a.canPrint !== b.canPrint) return a.canPrint ? -1 : 1;
      return b.printQty - a.printQty;
    });
  });

  localStorage.setItem('queueData', JSON.stringify(queueData));
}

// ══════════════ RENDER ══════════════
function render() {
  renderCol('pc1');
  renderCol('pc2');
  updateProgress();
  updateSummary();
  document.getElementById('summary').style.display = 'flex';
}

function renderCol(pc) {
  const items = queueData[pc];
  const body = document.getElementById(pc+'-body');
  document.getElementById(pc+'-count').textContent = items.length + '건';

  if (!items.length) {
    body.innerHTML = '<div class="empty"><div>해당 없음</div></div>';
    return;
  }

  const canItems   = items.filter(i => i.canPrint);
  const shortItems = items.filter(i => !i.canPrint);

  let html = '';

  // 인쇄 가능
  if (canItems.length) {
    html += `<div class="sec-label can">✅ 인쇄 가능 (${canItems.length}건)</div>`;
    html += '<div class="items-wrap">';
    canItems.forEach(item => {
      const isDone = doneSet.has(item.id);
      html += renderItem(item, pc, isDone, true);
    });
    html += '</div>';
  }

  // 전사지 부족
  if (shortItems.length) {
    html += `<div class="sec-label short">⚠️ 전사지 부족 (${shortItems.length}건)</div>`;
    html += '<div class="items-wrap">';
    shortItems.forEach(item => { html += renderItem(item, pc, false, false); });
    html += '</div>';
  }

  body.innerHTML = html;
}

function renderItem(item, pc, isDone, canPrint) {
  const checkIcon = isDone ? '✓' : canPrint ? '' : '✕';
  const cls = isDone ? 'done' : canPrint ? 'can' : 'short';
  const stockTxt = item.noStock ? '전사지 미등록' :
    `주문 ${item.orderQty}매 / 재고 ${item.transferStock < 0 ? '없음' : item.transferStock+'매'}`;
  const pct = item.transferStock > 0 ? Math.min(100, Math.round(item.printQty/item.orderQty*100)) : 0;

  return `
  <div class="print-item ${cls}" onclick="${canPrint ? `toggleDone('${item.id}')` : ''}">
    <div class="item-main">
      <div class="item-check">${checkIcon}</div>
      <div class="item-code">${item.code}</div>
      <div class="item-info">
        <div class="item-color">${item.color||'—'}</div>
        <div class="item-size">${item.size||'—'} 사이즈</div>
      </div>
      <div class="item-right">
        <div class="item-qty">${canPrint ? item.printQty : item.printQty}</div>
        <div class="item-unit">매</div>
      </div>
    </div>
    ${!canPrint ? `
    <div class="shortage-bar">
      <span>${stockTxt}</span>
      <div class="fill"><div class="fill-inner" style="width:${pct}%"></div></div>
    </div>` : ''}
  </div>`;
}

// ══════════════ DONE TOGGLE ══════════════
function toggleDone(id) {
  doneSet.has(id) ? doneSet.delete(id) : doneSet.add(id);
  localStorage.setItem('doneSet', JSON.stringify([...doneSet]));
  render();
}

// ══════════════ PROGRESS / SUMMARY ══════════════
function updateProgress() {
  ['pc1','pc2'].forEach((pc,i) => {
    const can = queueData[pc].filter(x=>x.canPrint);
    const done = can.filter(x=>doneSet.has(x.id)).length;
    const pct = can.length ? Math.round(done/can.length*100) : 0;
    document.getElementById(`prog${i+1}-txt`).textContent = `${done}/${can.length}`;
    document.getElementById(`prog${i+1}-bar`).style.width = pct+'%';
  });
}

function updateSummary() {
  const all = [...queueData.pc1, ...queueData.pc2];
  document.getElementById('sum-can').textContent   = all.filter(x=>x.canPrint).length;
  document.getElementById('sum-short').textContent = all.filter(x=>!x.canPrint).length;
  document.getElementById('sum-total').textContent = all.length;
}

// ══════════════ PC MAP ══════════════
function getPC(code) {
  const u = code.toUpperCase();
  for (const p of pcMap.pc1) if (u.startsWith(p)) return 'pc1';
  return 'pc2';
}

function updateSubLabels() {
  document.getElementById('pc1-sub').textContent = pcMap.pc1.map(p=>p+'*').join(', ') + ' 시리즈';
  document.getElementById('pc2-sub').textContent = pcMap.pc2.map(p=>p+'*').join(', ') + ' 시리즈';
}

function renderCfg() {
  const c1 = document.getElementById('cfg-pc1');
  const c2 = document.getElementById('cfg-pc2');
  c1.innerHTML = '';
  c2.innerHTML = '';
  pcMap.pc1.forEach(p => { c1.appendChild(mkCfgBtn(p,'pc1')); });
  pcMap.pc2.forEach(p => { c2.appendChild(mkCfgBtn(p,'pc2')); });
  updateSubLabels();
}

function mkCfgBtn(prefix, pc) {
  const btn = document.createElement('button');
  btn.className = 'cfg-code-btn ' + pc;
  btn.textContent = prefix + '*';
  btn.onclick = () => {
    if (pc === 'pc1') { pcMap.pc1 = pcMap.pc1.filter(x=>x!==prefix); pcMap.pc2.push(prefix); }
    else { pcMap.pc2 = pcMap.pc2.filter(x=>x!==prefix); pcMap.pc1.push(prefix); }
    localStorage.setItem('pcMap', JSON.stringify(pcMap));
    renderCfg();
  };
  return btn;
}

// ══════════════ RESET / MODAL ══════════════
function resetChecks() {
  if (!doneSet.size) return;
  if (confirm('완료 체크를 모두 초기화하시겠습니까?')) {
    doneSet.clear(); localStorage.setItem('doneSet','[]');
    render(); showToast('↺ 초기화 완료');
  }
}

function saveUrl() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;
  localStorage.setItem('gs_config', JSON.stringify({url}));
  showToast('✅ URL 저장됨');
}

function openModal() { document.getElementById('modal').classList.add('show'); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }

// ══════════════ TOAST ══════════════
let _tt;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(()=>el.classList.remove('show'), 2400);
}
</script>
</body>
</html>
